services:
  app:
    build: .
    container_name: lsp_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_ROOT_USER:-root}
      DB_PASS: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      DB_NAME: ${MYSQL_DATABASE:-local_service_provider}
      SESSION_SECRET: ${SESSION_SECRET:-local-service-provider-secret-key-2026}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: lsp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-local_service_provider}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lsp_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
